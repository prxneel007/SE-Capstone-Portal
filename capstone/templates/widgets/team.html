<div class="card">
  <h2>My team</h2>
  {% if w.team %}
    <p><a href="{{ url_for('teams.detail', team_id=w.team.id) }}"><strong>{{ w.team.name }}</strong></a></p>
    <p class="muted">{{ w.members|map(attribute='name')|join(', ') }}</p>
    <p>Project: {{ w.team.idea_title or 'not chosen yet' }}{% if w.team.mentor_name %} · Mentor: {{ w.team.mentor_name }}{% endif %}</p>
  {% else %}
    <p>You're not in a team yet.</p>
    <a class="btn" href="{{ url_for('teams.index') }}">Create or join a team</a>
  {% endif %}
</div>
