{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:auto">
  <h1>Create an account</h1>
  <form method="post">
    {{ csrf_field }}
    <label for="name">Full name</label>
    <input id="name" name="name" value="{{ request.form.name }}" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ request.form.email }}" required>
    <label for="srn">SRN / Employee ID</label>
    <input id="srn" name="srn" value="{{ request.form.srn }}" placeholder="PES2UG24AM049">
    <label for="password">Password (min 8 characters)</label>
    <input id="password" name="password" type="password" minlength="8" required>
    <label for="role">I am a</label>
    <select id="role" name="role">
      <option value="student">Student</option>
      <option value="faculty" {% if request.form.role == 'faculty' %}selected{% endif %}>Faculty</option>
    </select>
    <label for="faculty_code">Faculty sign-up code <span class="muted">(faculty only)</span></label>
    <input id="faculty_code" name="faculty_code" type="password">
    <p><button type="submit">Register</button></p>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
