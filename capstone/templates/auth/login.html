{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:auto">
  <h1>Log in</h1>
  <form method="post">
    {{ csrf_field }}
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ request.form.email }}" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <p><button type="submit">Log in</button></p>
  </form>
  <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
