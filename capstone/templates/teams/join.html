{% extends "base.html" %}
{% block title %}My Team{% endblock %}
{% block content %}
<h1>Join or create a team</h1>
<p class="muted">Teams have up to {{ config.MAX_TEAM_SIZE }} members. You can be in one team at a time.</p>
<div class="grid2">
  <form method="post" action="{{ url_for('teams.create') }}" class="card">
    {{ csrf_field }}
    <h2>Create a team</h2>
    <label for="name">Team name</label>
    <input id="name" name="name" minlength="3" maxlength="50" required>
    <p><button type="submit">Create team</button></p>
  </form>
  <form method="post" action="{{ url_for('teams.join') }}" class="card">
    {{ csrf_field }}
    <h2>Join with an invite code</h2>
    <label for="code">Invite code</label>
    <input id="code" name="code" placeholder="e.g. 3FA9C21B" required>
    <p><button type="submit">Join team</button></p>
  </form>
</div>
{% endblock %}
